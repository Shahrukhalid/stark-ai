# When the version on main changes, waits for the CI workflow on that exact commit to succeed
# before creating the tag vX.Y.Z and triggering the Desktop workflow.
# This prevents broken releases or premature tags from racing ahead of CI and security checks.
name: Tag release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Commit SHA to tag and release (leave blank for HEAD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency: tag-release

jobs:
  tag:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit || github.sha }}
      - name: Verify CI completion and create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_commit || github.sha }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re;print(re.search(r"__version__ = \"([0-9]+\.[0-9]+\.[0-9]+)\"", open("services/api/stark/__init__.py").read()).group(1))')"
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do"; exit 0
          fi

          echo "Release Gate: Checking CI completion on commit $TARGET_SHA..."
          deadline=$((SECONDS + 1200))
          ci_verified=false

          while [ $SECONDS -lt $deadline ]; do
            # Fetch workflow runs specifically matching CI
            runs_json="$(gh run list --workflow ci.yml --commit "$TARGET_SHA" --json databaseId,status,conclusion,headSha --limit 5 2>/dev/null || echo '[]')"
            
            # Parse runs strictly matching TARGET_SHA
            run_match="$(echo "$runs_json" | python3 -c '
              import json, os, sys
              try:
                  data = json.load(sys.stdin)
                  target = os.environ.get("TARGET_SHA", "")
                  matches = [r for r in data if str(r.get("headSha", "")).startswith(target[:7])]
                  if matches:
                      m = matches[0]
                      status = m.get("status") or "unknown"
                      conclusion = m.get("conclusion") or ""
                      sha = m.get("headSha") or ""
                      print(f"{status}|{conclusion}|{sha}")
                  else:
                      print("waiting||")
              except Exception as e:
                  print(f"error|{e}|")
              ' 2>/dev/null || echo 'error|parse_failure|')"

            IFS='|' read -r status conclusion run_sha <<< "$run_match"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Release gate PASSED: CI completed successfully on commit $TARGET_SHA (matching run SHA: $run_sha)"
                ci_verified=true
                break
              else
                echo "Release gate BLOCKED: CI completed with non-success conclusion '$conclusion' (status: '$status') on $TARGET_SHA"
                exit 1
              fi
            elif [ "$status" = "cancelled" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "failure" ]; then
              echo "Release gate BLOCKED: CI failed or cancelled on commit $TARGET_SHA (status: '$status', conclusion: '$conclusion')"
              exit 1
            elif [ "$status" = "error" ]; then
              echo "Release gate WARNING: Error inspecting CI runs: $conclusion"
            fi

            echo "Waiting for CI workflow to complete on $TARGET_SHA (current status: $status, conclusion: ${conclusion:-pending})..."
            sleep 20
          done

          if [ "$ci_verified" != "true" ]; then
            echo "Release gate BLOCKED: Failed to verify successful CI completion within timeout on commit $TARGET_SHA (ci_verified=$ci_verified)"
            exit 1
          fi

          echo "Creating Git tag $tag for commit $TARGET_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$TARGET_SHA" >/dev/null
          gh workflow run desktop.yml --ref "$tag"
          echo "Tagged $tag and started Desktop release builds."

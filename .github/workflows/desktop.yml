# Desktop installers: macOS .dmg (Apple silicon and Intel) and Windows .exe, each with everything bundled.
# Runs on version tags (v1.2.0) and attaches the installers to that release; run it by hand to just build them.
name: Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: STARK-AI-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: STARK-AI-macOS-Intel.dmg
          - os: windows-latest
            asset: STARK-AI-Windows-Setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Dashboard (static build for the app)
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && STARK_DESKTOP_BUILD=1 npm run build
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r services/api/requirements.lock
          pip install --no-deps ./services/api
          pip install --only-binary pywhispercpp -r desktop/requirements.txt  # prebuilt whisper.cpp only
      - name: Build the app
        run: pyinstaller desktop/stark.spec --noconfirm
      - name: Self-test of the built app (engine and dashboard start without a window)
        env:
          STARK_DESKTOP_DATA: ${{ runner.temp }}/stark-selftest
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then "dist/STARK AI.app/Contents/MacOS/STARK AI" --self-test
          else "dist/STARK AI/STARK AI.exe" --self-test; fi
      - name: macOS signature (stable self-signed identity, so permissions survive updates)
        if: runner.os == 'macOS'
        continue-on-error: true  # without it the app keeps its ad-hoc signature and still ships
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then echo "No signing identity set; the app keeps its ad-hoc signature."; exit 0; fi
          KC="$RUNNER_TEMP/stark.keychain-db"; KP=$(uuidgen)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/stark.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/stark.p12" -k "$KC" -P "$MAC_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          openssl pkcs12 -in "$RUNNER_TEMP/stark.p12" -clcerts -nokeys -passin pass:"$MAC_SIGN_PASSWORD" -out "$RUNNER_TEMP/stark.pem" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/stark.p12" -clcerts -nokeys -passin pass:"$MAC_SIGN_PASSWORD" -out "$RUNNER_TEMP/stark.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/stark.pem" || true
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --sign "STARK AI Self-Signed" --keychain "$KC" "dist/STARK AI.app"
          codesign --verify --deep --strict "dist/STARK AI.app" && codesign -dr - "dist/STARK AI.app"
          rm -f "$RUNNER_TEMP/stark.p12" "$RUNNER_TEMP/stark.pem"
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R "dist/STARK AI.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "STARK AI" -srcfolder dmg -ov -format UDZO "dist/${{ matrix.asset }}"
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          export STARK_VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('services/api/stark/__init__.py').read()).group(1))")
          choco install innosetup -y --no-progress >/dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" desktop/installer.iss
      - name: Keep the installer with this run
        run: echo "Built dist/${{ matrix.asset }} ($(du -h "dist/${{ matrix.asset }}" | cut -f1))"
      - name: Smoke-test installer asset integrity
        run: |
          ASSET_PATH="dist/${{ matrix.asset }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Expected installer $ASSET_PATH was not produced!"
            exit 1
          fi
          SIZE=$(wc -c < "$ASSET_PATH" | tr -d ' ')
          if [ "$SIZE" -lt 10485760 ]; then
            echo "ERROR: Installer $ASSET_PATH is suspiciously small ($SIZE bytes)!"
            exit 1
          fi
          echo "Integrity check passed: $ASSET_PATH ($SIZE bytes)"
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d95166914fa670a581898ef47dfd3065b # v4.6.1
        with:
          name: installer-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish Verified Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all installer artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: installers
      - name: Verify all three installer assets and prepare release
        run: |
          mkdir -p release_assets
          EXPECTED_ASSETS=(
            "STARK-AI-Windows-Setup.exe"
            "STARK-AI-macOS-AppleSilicon.dmg"
            "STARK-AI-macOS-Intel.dmg"
          )

          echo "Verifying all 3 installer assets exist and meet integrity requirements..."
          for asset in "${EXPECTED_ASSETS[@]}"; do
            found="$(find installers -name "$asset" -type f | head -n 1)"
            if [ -z "$found" ] || [ ! -f "$found" ]; then
              echo "CRITICAL: Missing expected installer asset $asset! Aborting release."
              exit 1
            fi
            size=$(wc -c < "$found" | tr -d ' ')
            if [ "$size" -lt 10485760 ]; then
              echo "CRITICAL: Installer $asset is smaller than 10MB ($size bytes)! Aborting release."
              exit 1
            fi
            echo "Verified: $asset ($((size / 1024 / 1024)) MB)"
            cp "$found" "release_assets/$asset"
            old_alias="${asset/STARK-AI-/STARK-OS-}"
            cp "$found" "release_assets/$old_alias"
          done

          echo "All 3 installers verified. Total assets ready for release: $(ls release_assets | wc -l)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--notes "Desktop installers for macOS and Windows: download, install, open STARK AI and follow the setup.")
          fi

          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "STARK AI ${GITHUB_REF_NAME#v}" "${NOTES_ARGS[@]}"
          
          for f in release_assets/*; do
            echo "Uploading $f to release $GITHUB_REF_NAME..."
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
          echo "Successfully published release $GITHUB_REF_NAME with all verified assets."
